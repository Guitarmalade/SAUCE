<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GUitarmalade — Dashboard Directions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Wet+Paint&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900&family=Archivo+Black&display=swap" rel="stylesheet">
  <style>
    :root{
      --cream: #F6EFDF; --cream-warm: #FCF6E8; --cream-shadow: #ECE2C9;
      --ink: #141A36; --ink-soft: #2A3055; --ink-mid: #4A5078; --ink-faint: #A8ABBE;
      --marmalade: #F5A623; --marmalade-deep: #E08810; --marmalade-glow: #FFC95C;
      --punch: #E63678; --punch-deep: #C42768;
      --acid: #B6E94B; --cyan: #2BC9E6; --grape: #8B5BD6; --tomato: #FF5A3C;
      --display: "Rubik Wet Paint", system-ui, sans-serif;
      --body: "Plus Jakarta Sans", system-ui, sans-serif;
      --r-md: 18px; --r-lg: 26px; --r-xl: 36px;
      --shadow-soft: 0 10px 40px -10px rgba(20,26,54,.18);
      --shadow-pop: 0 22px 60px -18px rgba(20,26,54,.35);
    }
    html,body{margin:0;padding:0;background:#E8E2D1;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;}
    *{box-sizing:border-box;}
    button{font-family:inherit;}
    .drip-text{font-family:var(--display);font-weight:400;letter-spacing:.01em;line-height:.95;}
    .label-eyebrow{font-family:var(--body);font-weight:800;text-transform:uppercase;letter-spacing:.16em;font-size:11px;color:var(--ink-mid);}
    .num-display{font-family:"Archivo Black", system-ui, sans-serif;letter-spacing:-.04em;}
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="splats.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="celebration.jsx"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="directions.jsx"></script>
</body>
</html>
