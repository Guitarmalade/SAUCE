<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guitarmalade SAUCE App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="sauce-screens.jsx"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #050505; }
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; font-family: 'Space Grotesk', sans-serif;
      background: radial-gradient(ellipse at 50% 20%, #1a0900 0%, #050505 60%);
    }
    ::-webkit-scrollbar { width: 0; }
    button { font-family: inherit; }
    textarea, input { font-family: inherit; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accentColor": "#FF6200",
      "sessionMins": 30,
      "darkMode": true,
      "showStreak": true,
      "sauceStep": 0
    }/*EDITMODE-END*/;

    // ─── Bottom Nav ────────────────────────────────────────────────────────────
    const NAV_ITEMS = [
      { id: 'home',     label: 'Home',     icon: '⌂' },
      { id: 'practice', label: 'Practice', icon: '▶' },
      { id: 'core',     label: 'C.O.R.E.', icon: '◈' },
      { id: 'profile',  label: 'Profile',  icon: '◉' },
    ];

    function BottomNav({ active, onNav, accentColor }) {
      return (
        <div style={{
          height: 60, background: '#0A0A0A',
          borderTop: '1px solid #1A1A1A',
          display: 'flex', alignItems: 'center',
          flexShrink: 0,
        }}>
          {NAV_ITEMS.map(item => {
            const isActive = item.id === active;
            return (
              <div key={item.id} onClick={() => onNav(item.id)} style={{
                flex: 1, display: 'flex', flexDirection: 'column',
                alignItems: 'center', justifyContent: 'center',
                gap: 3, cursor: 'pointer', height: '100%',
                transition: 'opacity 0.2s',
              }}>
                <div style={{
                  fontSize: 18, lineHeight: 1,
                  color: isActive ? accentColor : '#444',
                  transition: 'color 0.2s',
                }}>{item.icon}</div>
                <div style={{
                  fontFamily: "'Space Grotesk', sans-serif",
                  fontSize: 9, letterSpacing: 0.5, textTransform: 'uppercase',
                  color: isActive ? accentColor : '#444',
                  fontWeight: isActive ? 600 : 400,
                  transition: 'color 0.2s',
                }}>{item.label}</div>
              </div>
            );
          })}
        </div>
      );
    }

    // ─── Main App ──────────────────────────────────────────────────────────────
    function App() {
      const { useTweaks, TweaksPanel, TweakSection, TweakColor, TweakSlider, TweakToggle, TweakRadio } = window;

      const [tweaks, setTweaks] = useTweaks(TWEAK_DEFAULTS);
      const [screen, setScreen] = useState('splash');
      const [tab, setTab] = useState('home');
      const [profile, setProfile] = useState(() => {
        try {
          const saved = localStorage.getItem('gm_profile');
          return saved ? JSON.parse(saved) : null;
        } catch { return null; }
      });

      // Persist profile
      useEffect(() => {
        if (profile) localStorage.setItem('gm_profile', JSON.stringify(profile));
      }, [profile]);

      // If profile exists, skip onboarding
      useEffect(() => {
        if (profile && screen === 'splash') {
          // let splash play, then go home
        }
      }, []);

      const handleSplashDone = () => {
        setScreen(profile ? 'app' : 'onboarding');
      };

      const handleOnboardingDone = (data) => {
        const newProfile = {
          iam: data.iam,
          level: data.level,
          sauceIndex: 0,
          streak: 1,
        };
        setProfile(newProfile);
        setScreen('app');
      };

      const handleStartPractice = () => setTab('practice');

      const appTweaks = { ...tweaks };

      const renderTab = () => {
        if (!profile) return null;
        switch (tab) {
          case 'home':     return <HomeScreen profile={profile} tweaks={appTweaks} onStartPractice={handleStartPractice} />;
          case 'practice': return <PracticeScreen profile={profile} tweaks={appTweaks} />;
          case 'core':     return <CoreScreen profile={profile} tweaks={appTweaks} />;
          case 'profile':  return <ProfileScreen profile={profile} tweaks={appTweaks} />;
          default:         return null;
        }
      };

      const appContent = (
        <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: '#080808' }}>
          <div style={{ flex: 1, minHeight: 0, overflowY: 'auto' }}>
            {renderTab()}
          </div>
          <BottomNav active={tab} onNav={setTab} accentColor={tweaks.accentColor} />
        </div>
      );

      const content = (() => {
        switch (screen) {
          case 'splash':     return <SplashScreen onDone={handleSplashDone} />;
          case 'onboarding': return <OnboardingScreen onDone={handleOnboardingDone} tweaks={appTweaks} />;
          case 'app':        return appContent;
          default:           return null;
        }
      })();

      return (
        <>
          <IOSDevice dark={true} width={390} height={844}>
            {content}
          </IOSDevice>

          <TweaksPanel tweaks={tweaks} setTweaks={setTweaks}>
            <TweakSection title="Brand">
              <TweakColor id="accentColor" label="Accent Color" />
            </TweakSection>
            <TweakSection title="Practice">
              <TweakSlider id="sessionMins" label="Session Length" min={5} max={90} step={5} unit=" min" />
            </TweakSection>
            <TweakSection title="Display">
              <TweakToggle id="showStreak" label="Show Streak Counter" />
            </TweakSection>
            <TweakSection title="Dev Tools">
              <TweakRadio id="sauceStep" label="SAUCE Step (demo)" options={[
                {label:'S',value:0},{label:'A',value:1},{label:'U',value:2},{label:'C',value:3},{label:'E',value:4}
              ]} />
            </TweakSection>
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
